syntax = "proto3";
package muxcore.media.movies.v1;
option go_package = "github.com/Muxcore-Media/media-movies/proto/mgmntv1;mgmntv1";

service MovieManagementService {
  rpc AddMovie(AddMovieRequest) returns (AddMovieResponse);
  rpc RemoveMovie(RemoveMovieRequest) returns (RemoveMovieResponse);
  rpc RefreshMetadata(RefreshMetadataRequest) returns (RefreshMetadataResponse);
  rpc ListMovies(ListMoviesRequest) returns (ListMoviesResponse);
  rpc ListMissing(ListMissingRequest) returns (ListMissingResponse);
  rpc GetMovie(GetMovieRequest) returns (GetMovieResponse);
  rpc UpdateMovie(UpdateMovieRequest) returns (UpdateMovieResponse);
  rpc AddFile(AddFileRequest) returns (AddFileResponse);
  rpc RemoveFile(RemoveFileRequest) returns (RemoveFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc SetItemTags(SetItemTagsRequest) returns (SetItemTagsResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetCollectionMovies(GetCollectionMoviesRequest) returns (GetCollectionMoviesResponse);
  rpc ListAlternateTitles(ListAlternateTitlesRequest) returns (ListAlternateTitlesResponse);
  rpc AddAlternateTitle(AddAlternateTitleRequest) returns (AddAlternateTitleResponse);
  rpc RemoveAlternateTitle(RemoveAlternateTitleRequest) returns (RemoveAlternateTitleResponse);
  rpc ListTrailers(ListTrailersRequest) returns (ListTrailersResponse);
  rpc SetCollectionMonitored(SetCollectionMonitoredRequest) returns (SetCollectionMonitoredResponse);
  rpc GetCollectionPrefs(GetCollectionPrefsRequest) returns (GetCollectionPrefsResponse);
  rpc SyncCollection(SyncCollectionRequest) returns (SyncCollectionResponse);
}

message AddMovieRequest {
  int32 tmdb_id = 1;
  string title = 2;
  int32 year = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  repeated string genres = 7;
  string quality_profile_id = 8;
  string root_folder_path = 9;
}

message AddMovieResponse {
  string movie_id = 1;
}

message RemoveMovieRequest {
  string movie_id = 1;
  bool delete_files = 2;
}

message RemoveMovieResponse {}

message RefreshMetadataRequest {
  string movie_id = 1;
}

message RefreshMetadataResponse {}

message ListMoviesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  string genre = 4;
  string sort_by = 5;
  string sort_order = 6;
  string tag_id = 7;
}

message ListMoviesResponse {
  repeated MovieItem movies = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMissingRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMissingResponse {
  repeated MissingMovieItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message MissingMovieItem {
  string movie_id = 1;
  int32 tmdb_id = 2;
  string title = 3;
  int32 year = 4;
  string quality_profile_id = 5;
  string root_folder_path = 6;
}

message GetMovieRequest {
  string movie_id = 1;
}

message GetMovieResponse {
  MovieItem movie = 1;
}

message UpdateMovieRequest {
  string movie_id = 1;
  optional string quality_profile_id = 2;
  optional string root_folder_path = 3;
  optional bool monitored = 4;
  optional string minimum_availability = 5;
}

message UpdateMovieResponse {
  MovieItem movie = 1;
}

message MovieItem {
  string id = 1;
  int32 tmdb_id = 2;
  string title = 3;
  string original_title = 4;
  int32 year = 5;
  string overview = 6;
  string tagline = 7;
  int32 runtime = 8;
  double vote_average = 9;
  string status = 10;
  string imdb_id = 11;
  repeated string genres = 12;
  string poster_path = 13;
  string backdrop_path = 14;
  string poster_url = 15;
  string backdrop_url = 16;
  bool monitored = 17;
  bool has_file = 20;
  string created_at = 18;
  string updated_at = 19;
  string quality_profile_id = 21;
  string root_folder_path = 22;
  int32 collection_id = 23;
  string collection_name = 24;
}

message AddFileRequest {
  string movie_id = 1;
  string file_path = 2;
  string quality = 3;
  int64 size_bytes = 4;
  string container = 5;
}

message AddFileResponse {
  string file_id = 1;
}

message RemoveFileRequest {
  string file_id = 1;
  bool delete_files = 2;
}

message RemoveFileResponse {}

message ListFilesRequest {
  string movie_id = 1;
}

message ListFilesResponse {
  repeated MovieFile files = 1;
}

message MovieFile {
  string id = 1;
  string movie_id = 2;
  string file_path = 3;
  string quality = 4;
  int64 size_bytes = 5;
  string container = 6;
  string created_at = 7;
}

message CreateTagRequest {
  string label = 1;
}

message CreateTagResponse {
  string tag_id = 1;
}

message DeleteTagRequest {
  string tag_id = 1;
}

message DeleteTagResponse {}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message Tag {
  string id = 1;
  string label = 2;
  string created_at = 3;
}

message SetItemTagsRequest {
  string item_id = 1;
  repeated string tag_ids = 2;
}

message SetItemTagsResponse {}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionSummary collections = 1;
}

message CollectionSummary {
  int32 collection_id = 1;
  string name = 2;
  int32 movie_count = 3;
  bool monitored = 4;
}

message GetCollectionMoviesRequest {
  int32 collection_id = 1;
}

message GetCollectionMoviesResponse {
  int32 collection_id = 1;
  string name = 2;
  repeated MovieItem movies = 3;
}

message ListAlternateTitlesRequest {
  string movie_id = 1;
}

message AlternateTitle {
  string id = 1;
  string title = 2;
  string clean_title = 3;
  string source = 4;
}

message ListAlternateTitlesResponse {
  repeated AlternateTitle titles = 1;
}

message AddAlternateTitleRequest {
  string movie_id = 1;
  string title = 2;
}

message AddAlternateTitleResponse {
  AlternateTitle title = 1;
}

message RemoveAlternateTitleRequest {
  string movie_id = 1;
  string title_id = 2;
}

message RemoveAlternateTitleResponse {}

message ListTrailersRequest {
  string movie_id = 1;
}

message Trailer {
  string name = 1;
  string type = 2;
  string url = 3;
  string site = 4;
}

message ListTrailersResponse {
  repeated Trailer trailers = 1;
}

message SetCollectionMonitoredRequest {
  int32 collection_id = 1;
  bool monitored = 2;
  bool search_on_add = 3;
  string quality_profile_id = 4;
  string root_folder_path = 5;
}

message SetCollectionMonitoredResponse {}

message GetCollectionPrefsRequest {
  int32 collection_id = 1;
}

message GetCollectionPrefsResponse {
  int32 collection_id = 1;
  bool monitored = 2;
  bool search_on_add = 3;
  string quality_profile_id = 4;
  string root_folder_path = 5;
}

message SyncCollectionRequest {
  int32 collection_id = 1;
  bool add_missing = 2; // add TMDB parts not in library
}

message SyncCollectionResponse {
  int32 added = 1;
  int32 already_present = 2;
  int32 missing_on_tmdb = 3;
}

syntax = "proto3";
package muxcore.media.movies.v1;
option go_package = "github.com/Muxcore-Media/media-movies/proto/mgmntv1;mgmntv1";

service MovieManagementService {
  rpc AddMovie(AddMovieRequest) returns (AddMovieResponse);
  rpc RemoveMovie(RemoveMovieRequest) returns (RemoveMovieResponse);
  rpc RefreshMetadata(RefreshMetadataRequest) returns (RefreshMetadataResponse);
  rpc ListMovies(ListMoviesRequest) returns (ListMoviesResponse);
  rpc ListMissing(ListMissingRequest) returns (ListMissingResponse);
  rpc GetMovie(GetMovieRequest) returns (GetMovieResponse);
  rpc UpdateMovie(UpdateMovieRequest) returns (UpdateMovieResponse);
  rpc AddFile(AddFileRequest) returns (AddFileResponse);
  rpc RemoveFile(RemoveFileRequest) returns (RemoveFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc SetItemTags(SetItemTagsRequest) returns (SetItemTagsResponse);
  rpc GetItemTags(GetItemTagsRequest) returns (GetItemTagsResponse);
  // SetContentRating records the operator's parental classification for a
  // movie (ADR-0031 Decision 2). No caller authorization is checked here:
  // the consumer BFF restricts it to admins, like SetItemTags.
  rpc SetContentRating(SetContentRatingRequest) returns (SetContentRatingResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetCollectionMovies(GetCollectionMoviesRequest) returns (GetCollectionMoviesResponse);
  rpc GetCollectionPrefs(GetCollectionPrefsRequest) returns (GetCollectionPrefsResponse);
  rpc SetCollectionMonitored(SetCollectionMonitoredRequest) returns (SetCollectionMonitoredResponse);
  rpc SyncCollection(SyncCollectionRequest) returns (SyncCollectionResponse);
  rpc ListAlternateTitles(ListAlternateTitlesRequest) returns (ListAlternateTitlesResponse);
  rpc AddAlternateTitle(AddAlternateTitleRequest) returns (AddAlternateTitleResponse);
  rpc RemoveAlternateTitle(RemoveAlternateTitleRequest) returns (RemoveAlternateTitleResponse);
}

message AddMovieRequest {
  int32 tmdb_id = 1;
  string title = 2;
  int32 year = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  repeated string genres = 7;
  string quality_profile_id = 8;
  string root_folder_path = 9;
}

message AddMovieResponse {
  string movie_id = 1;
}

message RemoveMovieRequest {
  string movie_id = 1;
  bool delete_files = 2;
}

message RemoveMovieResponse {}

message RefreshMetadataRequest {
  string movie_id = 1;
}

message RefreshMetadataResponse {}

message ListMoviesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  string genre = 4;
  string sort_by = 5;
  string sort_order = 6;
  string tag_id = 7;
  // Optional parental narrowing (ADR-0031 Decision 2.1). It can only hide
  // items: with it unset or enabled=false the result is unchanged, and when
  // enabled, total and pagination count only the visible items.
  ClassificationFilter classification_filter = 8;
}

// ClassificationFilter hides items a restricted principal may not see. It is
// evaluated per ADR-0031 Decision 2.6: an item with no recorded rating
// (unavailable) is always hidden, an explicit NR is visible only when
// allow_unrated is set, a rated item must not exceed max_rating, a blocked tag
// hides the item, and a non-empty allowed_tags requires one match that never
// overrides a rating denial. Tags compare by exact case-folded match.
// Unknown tokens or empty tags are rejected with InvalidArgument.
message ClassificationFilter {
  bool enabled = 1;
  // Rating ceiling token on the ADR-0031 ladder (for example "PG-13"). Empty
  // means no ceiling. The BFF resolves kids_mode to "PG" before calling.
  string max_rating = 2;
  bool allow_unrated = 3;
  repeated string blocked_tags = 4;
  repeated string allowed_tags = 5;
}

message ListMoviesResponse {
  repeated MovieItem movies = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMissingRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMissingResponse {
  repeated MissingMovieItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message MissingMovieItem {
  string movie_id = 1;
  int32 tmdb_id = 2;
  string title = 3;
  int32 year = 4;
  string quality_profile_id = 5;
  string root_folder_path = 6;
}

message GetMovieRequest {
  string movie_id = 1;
}

message GetMovieResponse {
  MovieItem movie = 1;
}

message UpdateMovieRequest {
  string movie_id = 1;
  optional string quality_profile_id = 2;
  optional string root_folder_path = 3;
  optional bool monitored = 4;
}

message UpdateMovieResponse {
  MovieItem movie = 1;
}

message MovieItem {
  string id = 1;
  int32 tmdb_id = 2;
  string title = 3;
  string original_title = 4;
  int32 year = 5;
  string overview = 6;
  string tagline = 7;
  int32 runtime = 8;
  double vote_average = 9;
  string status = 10;
  string imdb_id = 11;
  repeated string genres = 12;
  string poster_path = 13;
  string backdrop_path = 14;
  string poster_url = 15;
  string backdrop_url = 16;
  bool monitored = 17;
  bool has_file = 20;
  string created_at = 18;
  string updated_at = 19;
  string quality_profile_id = 21;
  string root_folder_path = 22;
  int32 collection_id = 23;
  string collection_name = 24;
  // Field 25 was used for an unauthenticated content_rating by the unmerged
  // v0.1.22 tag (never on master). It is reserved and never read, so that
  // value cannot be mistaken for a classification.
  reserved 25;
  // Parental classification (ADR-0031 Decision 2). content_rating is a ladder
  // token, or "NR" for an explicit unrated record. Empty rating with empty
  // source means "unavailable" (nothing recorded), never "unrated".
  string content_rating = 26;
  // "operator" | "" ("tmdb" is reserved for a later slice).
  string content_rating_source = 27;
  // Labels of the item's operator tags, sorted, so list routes need no N+1.
  repeated string tag_labels = 28;
}

message AddFileRequest {
  string movie_id = 1;
  string file_path = 2;
  string quality = 3;
  int64 size_bytes = 4;
  string container = 5;
}

message AddFileResponse {
  string file_id = 1;
}

message RemoveFileRequest {
  string file_id = 1;
  bool delete_files = 2;
}

message RemoveFileResponse {}

message ListFilesRequest {
  string movie_id = 1;
}

message ListFilesResponse {
  repeated MovieFile files = 1;
}

message MovieFile {
  string id = 1;
  string movie_id = 2;
  string file_path = 3;
  string quality = 4;
  int64 size_bytes = 5;
  string container = 6;
  string created_at = 7;
}

message CreateTagRequest {
  string label = 1;
}

message CreateTagResponse {
  string tag_id = 1;
}

message DeleteTagRequest {
  string tag_id = 1;
}

message DeleteTagResponse {}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message Tag {
  string id = 1;
  string label = 2;
  string created_at = 3;
}

message SetItemTagsRequest {
  string item_id = 1;
  repeated string tag_ids = 2;
}

message SetItemTagsResponse {}

message GetItemTagsRequest {
  string item_id = 1;
}

message GetItemTagsResponse {
  repeated Tag tags = 1;
}

message SetContentRatingRequest {
  string movie_id = 1;
  // Ladder token. Empty with explicit_unrated=false clears the operator value.
  string content_rating = 2;
  // Records an explicit NR; content_rating must then be empty.
  bool explicit_unrated = 3;
}

message SetContentRatingResponse {}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionSummary collections = 1;
}

message CollectionSummary {
  int32 collection_id = 1;
  string name = 2;
  int32 movie_count = 3;
  bool monitored = 4;
}

message GetCollectionMoviesRequest {
  int32 collection_id = 1;
}

message GetCollectionMoviesResponse {
  int32 collection_id = 1;
  string name = 2;
  repeated MovieItem movies = 3;
}

message CollectionPrefs {
  int32 collection_id = 1;
  string name = 2;
  bool monitored = 3;
  bool search_on_add = 4;
  string quality_profile_id = 5;
  string root_folder_path = 6;
}

message GetCollectionPrefsRequest {
  int32 collection_id = 1;
}

message GetCollectionPrefsResponse {
  CollectionPrefs prefs = 1;
}

message SetCollectionMonitoredRequest {
  int32 collection_id = 1;
  bool monitored = 2;
  optional bool search_on_add = 3;
  string quality_profile_id = 4;
  string root_folder_path = 5;
}

message SetCollectionMonitoredResponse {
  CollectionPrefs prefs = 1;
}

message SyncCollectionRequest {
  int32 collection_id = 1;
  bool add_missing = 2;
}

message SyncCollectionResponse {
  int32 added = 1;
  int32 already_present = 2;
  int32 missing_on_source = 3;
}

message ListAlternateTitlesRequest {
  string movie_id = 1;
}

message AlternateTitle {
  string id = 1;
  string title = 2;
  string clean_title = 3;
  string source = 4;
}

message ListAlternateTitlesResponse {
  repeated AlternateTitle titles = 1;
}

message AddAlternateTitleRequest {
  string movie_id = 1;
  string title = 2;
}

message AddAlternateTitleResponse {
  AlternateTitle title = 1;
}

message RemoveAlternateTitleRequest {
  string movie_id = 1;
  string title_id = 2;
}

message RemoveAlternateTitleResponse {}

